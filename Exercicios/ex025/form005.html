<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php"  method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas"><label for="isxmas" Value="M">Masculino</label><br>
            <input type="radio" name="sexo" id="isxfem" checked><label for="isxfem" value="F">Feminino</label>
        </fieldset>
       <fieldset>
              <legend>Esportes favoritos</legend>
              <input type="checkbox" name="esfut" id="iesfut"><label for="iesfut">Futebol</label> <br>
              <input type="checkbox" name="esbas" id="iesbas" checked><label for="iesbas">Basquete</label> <br>
              <input type="checkbox" name="esna" id="iesna"><label for="iesna">Natação</label> <br>
              <input type="checkbox" name="este" id="ieste"><label for="ieste">Tênis</label> <br>
       </fieldset>
       
       <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
       </p>
    </form>
</body>
</html>
